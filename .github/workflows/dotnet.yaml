name: nopCommerce CI

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Show .NET info
        run: dotnet --info

      - name: Setup ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool  

      - name: Restore
        run: dotnet restore src/Presentation/Nop.Web/Nop.Web.csproj

      - name: Build
        run: dotnet build src/Presentation/Nop.Web/Nop.Web.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test src/Tests/Nop.Tests/Nop.Tests.csproj --configuration Release --no-restore
      - name: Test with TRX and JUnit
        run: |
          dotnet test src/Tests/Nop.Tests/Nop.Tests.csproj \
            --configuration Release \
            --no-restore \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "junit;LogFileName=test-results.xml" \
            --results-directory ./artifacts/test-results

      - name: Generate HTML report
        if: always()
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator \
            -reports:"./artifacts/test-results/**/*.trx" \
            -targetdir:"./artifacts/test-results/html" \
            -reporttypes:"Html"
      - name: Publish app
        run: dotnet publish src/Presentation/Nop.Web/Nop.Web.csproj --configuration Release --no-build --output ./artifacts/published
      - name: Prepare package name
        id: vars
        run: |
          echo "repo_name=${GITHUB_REPOSITORY##*/}" >> $GITHUB_OUTPUT
          echo "zip_name=${GITHUB_REPOSITORY##*/}-${GITHUB_RUN_NUMBER}.zip" >> $GITHUB_OUTPUT

      - name: Stage artifact contents
        if: always()
        run: |
          mkdir -p ./artifact-package/test-results
          cp -r ./artifacts/published ./artifact-package/published
          cp -r ./artifacts/test-results ./artifact-package/test-results
 
      - name: Create zip
        if: always()
        run: |
          cd artifact-package
          zip -r "../${{ steps.vars.outputs.zip_name }}" .

      - name: Upload zip artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.zip_name }}
          path: ./${{ steps.vars.outputs.zip_name }}
          compression-level: 0      