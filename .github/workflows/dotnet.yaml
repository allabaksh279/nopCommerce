name: nopCommerce CI

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Ensure dotnet tools are in PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Create directories
        run: |
          mkdir -p ./test-results
          mkdir -p ./published

      - name: Prepare artifact variables
        id: vars
        run: |
          echo "repo_name=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_OUTPUT"
          echo "zip_name=${GITHUB_REPOSITORY##*/}-${GITHUB_RUN_NUMBER}.zip" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore src/Presentation/Nop.Web/Nop.Web.csproj

      - name: Build
        run: dotnet build src/Presentation/Nop.Web/Nop.Web.csproj --configuration Release --no-restore

      - name: Test
        id: test
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-results"
          dotnet test src/Tests/Nop.Tests/Nop.Tests.csproj \
            --configuration Release \
            --no-restore \
            --logger "trx;LogFileName=$GITHUB_WORKSPACE/test-results/test-results.trx" \
            --logger "junit;LogFileName=$GITHUB_WORKSPACE/test-results/test-results.xml"

      - name: Debug test result files
        if: always()
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          find "$GITHUB_WORKSPACE" -type f \( -name "*.trx" -o -name "*.xml" \) | sort || true
          ls -lah "$GITHUB_WORKSPACE/test-results" || true

      - name: Generate HTML report
        if: always()
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          if [ -f "$GITHUB_WORKSPACE/test-results/test-results.trx" ]; then
            reportgenerator \
              -reports:"$GITHUB_WORKSPACE/test-results/test-results.trx" \
              -targetdir:"$GITHUB_WORKSPACE/test-results/html" \
              -reporttypes:"Html"
          else
            echo "TRX file not found, skipping HTML generation"
          fi

      - name: Publish app
        if: always()
        run: |
          dotnet publish src/Presentation/Nop.Web/Nop.Web.csproj \
            --configuration Release \
            --no-build \
            --output ./published

      - name: Prepare artifact
        if: always()
        run: |
          mkdir -p ./artifact-package
          [ -d ./published ] && cp -r ./published ./artifact-package/published || true
          [ -d ./test-results ] && cp -r ./test-results ./artifact-package/test-results || true
          cd ./artifact-package
          zip -r "../${{ steps.vars.outputs.zip_name }}" .

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.repo_name }}-${{ github.run_number }}
          path: ./${{ steps.vars.outputs.zip_name }}
          retention-days: 5