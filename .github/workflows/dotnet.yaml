---
on:
    pull_request:
        branches:
            - develop
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Setup dotnet
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: 10.0.x
            - uses: actions/checkout@v5
            - name: restore
              run: dotnet restore src/Presentation/Nop.web/Nop.Web.csproj
            - name: build
              run: dotnet build --configuration Debug src/Presentation/Nop.web/Nop.Web.csproj --no-restore
            - name: test
              run: dotnet test src/Tests/Nop.Tests/Nop.Tests.csproj --no-restore --no-build
            - name: publish
              run: dotnet publish --configuration Release src/Presentation/Nop.web/Nop.Web.csproj --no-restore --no-build -o ./publish        
                          