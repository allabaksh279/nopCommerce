name: nopCommerce CI

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Ensure dotnet tools are in PATH
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Create directories
        run: |
          mkdir -p ./test-results
          mkdir -p ./published

      - name: Restore
        run: dotnet restore src/Presentation/Nop.Web/Nop.Web.csproj

      - name: Build
        run: dotnet build src/Presentation/Nop.Web/Nop.Web.csproj --configuration Release --no-restore

      - name: Test
        id: test
        run: |
          dotnet test src/Tests/Nop.Tests/Nop.Tests.csproj \
            --configuration Release \
            --no-restore \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "junit;LogFileName=test-results.xml" \
            --results-directory ./test-results

      - name: Generate HTML report
        if: always()
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator \
            -reports:"./test-results/*.trx" \
            -targetdir:"./test-results/html" \
            -reporttypes:Html

      - name: Publish app
        if: always()
        run: |
          dotnet publish src/Presentation/Nop.Web/Nop.Web.csproj \
            --configuration Release \
            --no-build \
            --output ./published

      - name: Prepare artifact
        if: always()
        run: |
          mkdir -p ./artifact-package
          cp -r ./published ./artifact-package/published
          cp -r ./test-results ./artifact-package/test-results
          cd ./artifact-package
          zip -r "../${{ github.event.repository.name }}-${{ github.run_number }}.zip" .

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ github.run_number }}
          path: ./${{ github.event.repository.name }}-${{ github.run_number }}.zip
          retention-days: 5